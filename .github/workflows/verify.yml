name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O typecheck da API depende dos tipos gerados pelo Prisma Client.
      # Sem isso o tsc acusa `any` implicito em todo lugar que toca o banco.
      - run: npm run db:generate

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
