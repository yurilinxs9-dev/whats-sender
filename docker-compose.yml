version: '3.8'

services:
  sender-db:
    # Mesma major do banco de origem: pg_dump recusa servidor mais novo.
    image: postgres:17-alpine
    container_name: sender-db
    restart: unless-stopped
    ports:
      # Apenas loopback: o backend fala pela rede interna do compose, e nada
      # fora da maquina precisa alcancar o banco.
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${SENDER_DB_USER:-sender}
      POSTGRES_PASSWORD: ${SENDER_DB_PASSWORD:?defina SENDER_DB_PASSWORD no .env}
      POSTGRES_DB: ${SENDER_DB_NAME:-whatsapp_sender}
    volumes:
      - sender-pgdata:/var/lib/postgresql/data
    networks:
      - sender-network

  sender-redis:
    image: redis:7-alpine
    container_name: sender-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - sender-network

  sender-backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sender-backend
    restart: unless-stopped
    ports:
      # A VPS publica em 3003 (o nginx aponta pra la); local usa 3001.
      - '${API_PORT:-3001}:3001'
    depends_on:
      - sender-db
      - sender-redis
    environment:
      # A janela de envio e o reset do cap diario sao calculados com a hora
      # local do processo. Sem isto o container roda em UTC e a janela sai
      # tres horas adiantada: o disparo comeca de madrugada e para no meio
      # da tarde.
      - TZ=${TZ:-America/Sao_Paulo}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - REDIS_URL=${REDIS_URL}
      - UAZAPI_URL=${UAZAPI_URL}
      - UAZAPI_GLOBAL_TOKEN=${UAZAPI_GLOBAL_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3001
      - NODE_ENV=production
    networks:
      - sender-network

  sender-nginx:
    image: nginx:alpine
    container_name: sender-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sender-backend
    networks:
      - sender-network

networks:
  sender-network:
    driver: bridge

volumes:
  sender-pgdata:
